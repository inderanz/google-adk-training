[project]
name = "module135-bank-persistence"
version = "0.1.0"
description = "ADK sessions and Firestore case records for a fictional bank"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.11.0",
    "google-cloud-firestore==2.33.0",
    "sqlalchemy[asyncio]==2.1.1",
]

[project.optional-dependencies]
managed = ["google-adk[gcp]==2.11.0"]

[tool.uv]
package = false
